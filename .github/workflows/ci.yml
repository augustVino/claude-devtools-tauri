name: CI

on:
  pull_request:
    # codex P2-32: skip draft PR (via job-level if below)
  push:
    branches:
      - master
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - '.gitnexus/**'
      - 'scripts/**'
      - '.claude/**'
      - 'LICENSE'
      - 'NOTICE'
      - 'ROADMAP.md'

# codex P0-9: explicit minimal permissions for PUBLIC repo
permissions:
  contents: read

# codex P1-21: cancel superseded PR builds
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    if: github.event.pull_request.draft == false || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # codex P0-6: Tauri v2 Linux compile-time deps
      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libssl-dev pkg-config \
            librsvg2-dev libgtk-3-dev libayatana-appindicator3-dev libxdo-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy  # v4: drop rustfmt (no global fmt --check)

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> ./target

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      # Frontend checks
      - name: Lint (eslint)
        run: pnpm lint
      - name: Typecheck (tsc)
        run: pnpm typecheck
      - name: Frontend build (codex P2-30)
        run: pnpm build
      - name: Frontend test (vitest)
        run: pnpm test

      # Rust checks (subshell to avoid cwd leak, codex P1-18)
      # v4: NO cargo fmt --check (global fmt deferred to standalone PR, see ROADMAP)
      - name: Cargo check
        run: (cd src-tauri && cargo check --all-targets)
      - name: Cargo clippy
        # TODO(phase-3e-item4): existing 196+221 warnings; after batch-fix,
        # change to: cargo clippy --all-targets -- -D warnings
        run: (cd src-tauri && cargo clippy --all-targets)
      - name: Cargo test
        run: (cd src-tauri && cargo test --all)
